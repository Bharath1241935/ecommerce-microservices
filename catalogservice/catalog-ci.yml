name: Catalog Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Catalog Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bookstore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven versions
        run: |
          java -version
          mvn -version
      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/bookstore
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: mvn -B -f catalog-service/pom.xml clean verify
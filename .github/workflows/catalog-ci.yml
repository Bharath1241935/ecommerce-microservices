
name: Catalog Service CI

on:
  push:
    branches: [main, develop, Develop]
  pull_request:
    branches: [main, develop, Develop]
  workflow_dispatch:

jobs:
  catalog-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ecommerce_catalog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_catalog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify project files
        run: |
          ls -la
          ls -la catalogservice
          test -f catalogservice/pom.xml

      - name: Build and test Catalog Service
        run: mvn -B -f catalogservice/pom.xml clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecommerce_catalog
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: localdev123
